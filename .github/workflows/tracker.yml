name: Build-Pulse Analytics Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline-and-track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd tracker
          npm install
      
      - name: Run Security Scans (Simulated)
        run: sleep 5
        
      - name: Build Application (Simulated)
        run: sleep 10

      - name: Run Build-Pulse Tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tracker/fetch-metrics.js

      - name: Save Metrics to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git commit -m "chore: update build metrics [skip ci]" || echo "No new metrics to commit"
          git push
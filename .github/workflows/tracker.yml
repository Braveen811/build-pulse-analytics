name: Build-Pulse Analytics Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline-and-track:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the Action permission to push the JSON file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 1. SIMULATE CI/CD WORKLOAD ---
      - name: Install Dependencies
        run: |
          cd tracker
          npm install
      
      - name: Run Security Scans (Simulated)
        run: sleep 5
        
      - name: Build Application (Simulated)
        run: sleep 10

      # --- 2. EXTRACT PIPELINE METRICS ---
      - name: Run Build-Pulse Tracker
        env:
          # GitHub automatically provides this token - no credit card needed!
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tracker/fetch-metrics.js

      # --- 3. ZERO-DB STORAGE COMMIT ---
      - name: Save Metrics to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          # The [skip ci] tag is critical. It tells GitHub NOT to trigger another run when this commit is pushed.
          git commit -m "chore: update build metrics [skip ci]" || echo "No new metrics to commit"
          git push